org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Build Properties
java_version=21
java_toolchain=21

# Minecraft Properties
# 注意：Parchment 官方未发布 1.20.5 的 release 导出（仅 nightly SNAPSHOT，Gradle 拒绝 changing 版本），
# 故借用 1.20.6 的 release 数据（两版本 API 差异极小，不匹配条目会被 Loom 忽略）。
minecraft_version=1.20.5
parchment_minecraft_version=1.20.6
parchment_mappings_version=2024.05.01

# Dependency Versions
fabric_loader_version=0.16.14
fabric_api_version=0.97.8+1.20.5
jade_version=14.2.0+fabric

# Mod Properties
mod_id=ultramarine
mod_name=Ultramarine: Recast
mod_authors=Soul_Shadow, LocusAzzurro, Flechazo
mod_license=BSD-3-Clause (code); CC-BY-NC 4.0 (assets)
mod_version=0.7.0
maven_group=com.voxelutopia
archives_base_name=ultramarine-recast
mod_description=A Chinese Style Minecraft Mod. Recast edition ported to Minecraft 1.20.5 Fabric.
mod_display_url=
mod_issue_tracker=
