plugins {
    id 'dev.architectury.loom-no-remap' version '1.17.493'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-fabric-${project.minecraft_version}"
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        url = 'https://maven.architectury.dev/'
    }
}

loom {
    accessWidenerPath = file('src/main/resources/ultramarine.accesswidener')
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Minecraft 26.1+ is not obfuscated: no mappings are needed and mod jars are used as-is.
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly files("libs/rei-26.1.819.jar")
    compileOnly "dev.architectury:architectury-fabric:20.0.6"
    compileOnly "maven.modrinth:jade:${project.jade_version}"
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    var replaceProperties = [
            minecraft_version: project.minecraft_version,
            mod_id           : project.mod_id,
            mod_name         : project.mod_name,
            mod_license      : project.mod_license,
            mod_version      : project.mod_version,
            mod_authors      : project.mod_authors,
            mod_description  : project.mod_description,
            mod_display_url  : project.mod_display_url,
            mod_issue_tracker: project.mod_issue_tracker,
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_version.toInteger()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.java_toolchain.toInteger())
    withSourcesJar()
}
