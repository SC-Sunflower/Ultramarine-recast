plugins {
    id 'fabric-loom' version '1.15.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-fabric-${project.minecraft_version}"
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        url = 'https://maven.shedaniel.me/'
    }
}

loom {
    accessWidenerPath = file('src/main/resources/ultramarine.accesswidener')
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:21.11.816"
    // 1.20.2 分支不依赖 Porting Lib：原作者代码里使用的 Porting Lib 存储/配方包装 API
    // 已由本仓库自带的 com.voxelutopia.ultramarine.data.storage 包提供等价实现。

    // 可选集成（1.20.2 的 JEI 16 / Jade 12 尚无 Modrinth Maven 坐标，且 API 与 1.20.1 的
    // 15.x / 11.x 不兼容——此分支暂不编译集成类，代码保留待后续适配）
    sourceSets.main.java.exclude(
        'com/voxelutopia/ultramarine/client/integration/jei/**',
        'com/voxelutopia/ultramarine/client/integration/jade/**'
    )

    // 反编译产物引用 javax.annotation 注解（Java 11+ 已移除该包）
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    var replaceProperties = [
            minecraft_version: project.minecraft_version,
            mod_id           : project.mod_id,
            mod_name         : project.mod_name,
            mod_license      : project.mod_license,
            mod_version      : project.mod_version,
            mod_authors      : project.mod_authors,
            mod_description  : project.mod_description,
            mod_display_url  : project.mod_display_url,
            mod_issue_tracker: project.mod_issue_tracker,
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_version.toInteger()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.java_toolchain.toInteger())
    withSourcesJar()
}
